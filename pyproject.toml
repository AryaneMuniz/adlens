[project]
name = "adlens"
version = "0.1.0"
description = "Creative intelligence: AI tags ad creatives and finds which features drive performance"
readme = "README.md"
authors = [
      { name = "Aryane Muniz", email = "186922399+AryaneMuniz@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = []

[project.scripts]
adlens = "adlens:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]
