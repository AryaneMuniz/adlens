[project]
name = "adlens"
version = "0.1.0"
description = "Inteligência de criativos: IA etiqueta criativos de anúncios e descobre quais características puxam a performance"
readme = "README.md"
authors = [
      { name = "Aryane Muniz", email = "186922399+AryaneMuniz@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "anthropic>=2.12.0",
    "duckdb>=2.0.0",
    "mcp>=2.3.0",
    "pillow>=13.0.0",
]

[project.scripts]
adlens = "adlens.cli:main"
adlens-mcp = "adlens.server:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]
