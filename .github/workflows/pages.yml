# Publica o hub do adlens no GitHub Pages a cada merge na main (o "CD").
name: Hub

on:
  push:
    branches: [main]
  workflow_dispatch: # botão "Run workflow" pra publicar na mão

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Instalar
        run: uv sync --locked
      - name: Gerar dados de demonstração
        run: uv run adlens gerar --n 1000 --imagens
      - name: Montar o hub
        run: uv run adlens hub --saida site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Publicar
        id: deploy
        uses: actions/deploy-pages@v4
